<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>沖繩隨身旅程指南 · 4D3N 自駕遊</title>
  <style>
    :root {
      --bg: #F4F8F6;
      --card-bg: #FFFFFF;
      --primary: #2D5A46;
      --primary-light: #EBF4F0;
      --forest-dark: #1E3F31;
      --sky-blue: #2A7B9B;
      --sky-light: #E8F3F7;
      --accent: #E58D48;
      --text: #2C3E35;
      --text-muted: #667C72;
      --border: #D5E4DC;
      --shadow: 0 3px 12px rgba(45, 90, 70, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    /* 頂部自然風格看板 */
    header {
      background: linear-gradient(145deg, var(--forest-dark) 0%, var(--primary) 50%, var(--sky-blue) 100%);
      color: #fff;
      padding: 30px 18px 20px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 6px 20px rgba(30, 63, 49, 0.12);
    }
    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      opacity: 0.95;
      margin-bottom: 10px;
    }
    .weather-pill {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .subhead {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.88);
      margin-top: 4px;
      display: flex;
      gap: 10px;
    }

    /* 行程公費獨立看板 */
    .ledger-overview {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 10px 12px;
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      gap: 6px;
    }
    .ledger-item span { display: block; font-size: 11px; opacity: 0.88; }
    .ledger-item strong { font-size: 15px; font-weight: 700; color: #fff; }

    /* 導航切換列 */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .nav-btn {
      flex: 1;
      text-align: center;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    /* 每日卡片 */
    .day-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .day-badge {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 800;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 3px;
    }
    .day-title { font-size: 16px; font-weight: 700; color: var(--forest-dark); }
    .day-sub { font-size: 12px; color: var(--text-muted); }

    /* 時間軸項目 */
    .timeline { position: relative; padding-left: 16px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: #E2ECE7;
    }
    .event-card {
      position: relative;
      background: #FAFDFC;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .event-card::before {
      content: '';
      position: absolute;
      left: -17px;
      top: 16px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid #fff;
    }
    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .event-time {
      font-weight: 700;
      font-size: 12px;
      color: var(--sky-blue);
      background: var(--sky-light);
      padding: 2px 7px;
      border-radius: 5px;
    }
    .event-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      background: #EBF3EF;
      color: var(--primary);
    }
    .event-tag.warn {
      background: #FEF3E8;
      color: var(--accent);
    }
    .event-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .event-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 6px;
    }

    /* 路線導航提示條 */
    .route-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: #EEF6FA;
      color: var(--sky-blue);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    /* 代墊與費用 */
    .event-cost-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F2F7F4;
      padding: 6px 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 12px;
    }
    .payer-toggle {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .payer-btn {
      border: 1px solid #C9DBD1;
      background: #fff;
      color: var(--text-muted);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .payer-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }
    .cost-input-box {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      color: var(--forest-dark);
    }
    .cost-input-box input {
      width: 75px;
      border: 1px solid #C9DBD1;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      text-align: right;
    }

    .event-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .link-btn {
      font-size: 11px;
      color: var(--sky-blue);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #fff;
      border: 1px solid #D6E7EF;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .edit-btn {
      font-size: 11px;
      color: var(--primary);
      border: 1px solid #CCE1D7;
      background: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-left: auto;
    }
    .del-btn {
      font-size: 11px;
      color: #A9B8B0;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 4px;
    }

    .day-summary-bar {
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--primary-light);
      border-radius: 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      color: var(--forest-dark);
    }
    .add-event-btn {
