<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>沖繩隨身旅程指南 · 4D3N 自駕遊</title>
  <style>
    :root {
      --bg: #F4F8F6;
      --card-bg: #FFFFFF;
      --primary: #2D5A46;
      --primary-light: #EBF4F0;
      --forest-dark: #1E3F31;
      --sky-blue: #2A7B9B;
      --sky-light: #E8F3F7;
      --accent: #E58D48;
      --text: #2C3E35;
      --text-muted: #667C72;
      --border: #D5E4DC;
      --shadow: 0 3px 12px rgba(45, 90, 70, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    header {
      background: linear-gradient(145deg, var(--forest-dark) 0%, var(--primary) 50%, var(--sky-blue) 100%);
      color: #fff;
      padding: 30px 18px 20px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 6px 20px rgba(30, 63, 49, 0.12);
    }
    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      opacity: 0.95;
      margin-bottom: 10px;
    }
    .weather-pill {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .subhead {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.88);
      margin-top: 4px;
      display: flex;
      gap: 10px;
    }

    .ledger-overview {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 10px 12px;
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      gap: 6px;
    }
    .ledger-item span { display: block; font-size: 11px; opacity: 0.88; }
    .ledger-item strong { font-size: 15px; font-weight: 700; color: #fff; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .nav-btn {
      flex: 1;
      text-align: center;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .day-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .day-badge {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 800;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 3px;
    }
    .day-title { font-size: 16px; font-weight: 700; color: var(--forest-dark); }
    .day-sub { font-size: 12px; color: var(--text-muted); }

    .timeline { position: relative; padding-left: 16px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: #E2ECE7;
    }
    .event-card {
      position: relative;
      background: #FAFDFC;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .event-card::before {
      content: '';
      position: absolute;
      left: -17px;
      top: 16px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid #fff;
    }
    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .event-time {
      font-weight: 700;
      font-size: 12px;
      color: var(--sky-blue);
      background: var(--sky-light);
      padding: 2px 7px;
      border-radius: 5px;
    }
    .event-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      background: #EBF3EF;
      color: var(--primary);
    }
    .event-tag.warn {
      background: #FEF3E8;
      color: var(--accent);
    }
    .event-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .event-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .route-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: #EEF6FA;
      color: var(--sky-blue);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .event-cost-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F2F7F4;
      padding: 6px 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 12px;
    }
    .payer-toggle {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .payer-btn {
      border: 1px solid #C9DBD1;
      background: #fff;
      color: var(--text-muted);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .payer-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }
    .cost-input-box {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      color: var(--forest-dark);
    }
    .cost-input-box input {
      width: 75px;
      border: 1px solid #C9DBD1;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      text-align: right;
    }

    .event-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .link-btn {
      font-size: 11px;
      color: var(--sky-blue);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #fff;
      border: 1px solid #D6E7EF;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .edit-btn {
      font-size: 11px;
      color: var(--primary);
      border: 1px solid #CCE1D7;
      background: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-left: auto;
    }
    .del-btn {
      font-size: 11px;
      color: #A9B8B0;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 4px;
    }

    .day-summary-bar {
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--primary-light);
      border-radius: 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      color: var(--forest-dark);
    }
    .add-event-btn {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 2px dashed #C5DAD0;
      border-radius: 10px;
      background: transparent;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 購物清單 */
    .shopping-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .shop-person-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .shop-person-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    .shop-item-card {
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .shop-item-card.done {
      background: #F9FAF9;
      opacity: 0.6;
    }
    .shop-item-card.done .shop-title {
      text-decoration: line-through;
    }
    .shop-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .shop-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }
    .shop-title { font-size: 14px; font-weight: 600; }
    .shop-tag { font-size: 10px; background: #EAF4F9; color: var(--sky-blue); padding: 2px 5px; border-radius: 4px; }
    .shop-cost-box {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 600;
      color: var(--forest-dark);
    }
    .shop-cost-box input {
      width: 70px;
      border: 1px solid #C9DBD1;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      text-align: right;
    }

    /* 行前備忘清單 */
    .checklist-group {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .checklist-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--forest-dark);
    }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }
    .check-item:last-child { border-bottom: none; }
    .check-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      margin-top: 2px;
      accent-color: var(--primary);
    }
    .check-text { flex: 1; }
    .check-text strong { display: block; color: var(--text); }
    .check-text span { font-size: 11px; color: var(--text-muted); }
    .check-item.done .check-text strong { text-decoration: line-through; opacity: 0.5; }
    .del-check-btn {
      color: #BFCEC6;
      border: none;
      background: transparent;
      font-size: 13px;
      cursor: pointer;
    }

    /* 彈窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
    }
    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center;
        padding: 20px;
      }
    }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 450px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }
    @media (min-width: 600px) {
      .modal { border-radius: 18px; }
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 16px; font-weight: 700; color: var(--forest-dark); }
    .modal-close-x {
      border: none;
      background: transparent;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .modal-body {
      padding: 14px 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }
    .modal-body label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .modal-body label:first-child { margin-top: 0; }
    .modal-body input, .modal-body select, .modal-body textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #CCDCD3;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .route-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .modal-footer {
      padding: 12px 18px 20px;
      border-top: 1px solid var(--border);
      background: #FAFDFC;
      display: flex;
      gap: 8px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }
    .modal-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-save { background: var(--primary); color: #fff; }
    .btn-cancel { background: #EEF4F1; color: var(--text-muted); }

    .reset-btn-bar {
      text-align: center;
      margin-top: 30px;
    }
    .reset-btn {
      font-size: 11px;
      color: #92A69C;
      background: transparent;
      border: 1px solid #D1E0D8;
      padding: 5px 12px;
      border-radius: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-meta">
      <span>🌿 OKINAWA 4D3N 自駕行</span>
      <a class="weather-pill" href="https://tenki.jp/forecast/10/50/9110/47201/1hour.html" target="_blank">
        🌤️ 那霸天候 · tenki.jp
      </a>
    </div>
    <h1>沖繩隨身旅程指南 <span>🌴</span></h1>
    <div class="subhead">
      <span>📅 11/11 (三) - 11/14 (六)</span>
      <span>🚗 自駕悠遊行</span>
    </div>

    <!-- 行程公費獨立看板 -->
    <div class="ledger-overview">
      <div class="ledger-item">
        <span>Dora 先墊 (行程)</span>
        <strong id="total-dora-advance">¥0</strong>
      </div>
      <div class="ledger-item">
        <span>Renee 先墊 (行程)</span>
        <strong id="total-renee-advance">¥0</strong>
      </div>
      <div class="ledger-item">
        <span>行程活動總額</span>
        <strong id="total-trip-cost">¥0</strong>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-btn-itinerary" onclick="switchMainTab('itinerary')">📅 每日行程</button>
      <button class="nav-btn" id="tab-btn-shopping" onclick="switchMainTab('shopping')">🛍️ 購物清單</button>
      <button class="nav-btn" id="tab-btn-checklist" onclick="switchMainTab('checklist')">📋 行前備忘</button>
    </div>
  </header>

  <main class="container">
    <!-- 1. 行程分頁 -->
    <div id="itinerary-section"></div>

    <!-- 2. 購物清單分頁 -->
    <div id="shopping-section" style="display: none;">
      <div class="shopping-tabs">
        <button class="shop-person-btn active" id="btn-person-dora" onclick="switchShopPerson('Dora')">
          🌸 Dora 的清單 (<span id="dora-count">0</span>)
        </button>
        <button class="shop-person-btn" id="btn-person-renee" onclick="switchShopPerson('Renee')">
          🌿 Renee 的清單 (<span id="renee-count">0</span>)
        </button>
      </div>

      <div class="day-card" style="margin-bottom: 12px; padding: 12px 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px;">
          <span>👤 <strong id="current-person-label">Dora</strong> 個人購物小計：</span>
          <strong id="person-shop-total" style="color: var(--primary); font-size: 16px;">¥0</strong>
        </div>
      </div>

      <div style="display: flex; gap: 6px; margin-bottom: 12px;">
        <input type="text" id="new-shop-title" placeholder="想買什麼？(例: 睫毛膏、伴手禮)" style="flex:1; padding:8px 10px; border:1px solid #CCDCD3; border-radius:8px; font-size:13px;">
        <input type="text" id="new-shop-tag" placeholder="類別" style="width:65px; padding:8px 6px; border:1px solid #CCDCD3; border-radius:8px; font-size:13px;">
        <button onclick="addShopItem()" style="padding:8px 12px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer;">新增</button>
      </div>

      <div id="shop-items-container"></div>
    </div>

    <!-- 3. 行前備忘清單分頁 -->
    <div id="checklist-section" style="display: none;">
      <div id="checklist-containers"></div>

      <div class="day-card" style="margin-top: 14px; background: #FAFDFC;">
        <h4 style="font-size: 13px; color: var(--forest-dark); margin-bottom: 8px;">＋ 新增自訂行前備忘</h4>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <select id="new-check-cat" onchange="toggleCustomCatInput(this.value)" style="padding: 8px 10px; border: 1px solid #CCDCD3; border-radius: 8px; font-size: 13px;">
            <option value="🚗 自駕開車必備">🚗 自駕開車必備</option>
            <option value="📱 通關與支付">📱 通關與支付</option>
            <option value="👗 衣著">👗 衣著</option>
            <option value="🧴 日用品">🧴 日用品</option>
            <option value="__NEW__">＋ 自訂全新主題...</option>
          </select>
          <input type="text" id="new-check-custom-cat" placeholder="請輸入新主題名稱 (例: 攝影器材)" style="display: none; padding: 8px 10px; border: 1px solid #CCDCD3; border-radius: 8px; font-size: 13px;">
          <input type="text" id="new-check-title" placeholder="備忘項目名稱 (例: 遮陽帽、相機腳架)" style="padding: 8px 10px; border: 1px solid #CCDCD3; border-radius: 8px; font-size: 13px;">
          <input type="text" id="new-check-desc" placeholder="詳細備註或提醒 (選填)" style="padding: 8px 10px; border: 1px solid #CCDCD3; border-radius: 8px; font-size: 13px;">
          <button onclick="addChecklistItem()" style="padding: 9px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">加入備忘清單</button>
        </div>
      </div>
    </div>

    <!-- 底部重設工具 -->
    <div class="reset-btn-bar">
      <button class="reset-btn" onclick="resetToDefault()">🔄 若畫面有問題，點此一鍵修復預設資料</button>
    </div>
  </main>

  <!-- 彈窗 -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">新增行程</h3>
        <button class="modal-close-x" onclick="closeModal()">✕</button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="modal-day-idx">
        <input type="hidden" id="modal-edit-idx">
        
        <label>⏰ 時間 (例: 08:30、13:30、11:00～11:30)</label>
        <input type="text" id="modal-time" placeholder="請輸入時間，儲存後自動排序">

        <label>📍 地點 / 行程名稱</label>
        <input type="text" id="modal-event-title" placeholder="景點名稱或活動">

        <label>🗺️ 路線導航（可預填起點與終點）</label>
        <div class="route-inputs">
          <input type="text" id="modal-origin" placeholder="起點 (如: 那霸機場)">
          <input type="text" id="modal-destination" placeholder="終點 (如: 租車公司)">
        </div>

        <label>🏷️ 標籤狀態</label>
        <input type="text" id="modal-tag" placeholder="例: 預約完成、自駕移動、必吃美食">

        <label>📝 備註 / 提醒細節</label>
        <textarea id="modal-desc" rows="2" placeholder="注意事項、營業時間或電話"></textarea>

        <label>💴 費用預算 (¥ 日圓)</label>
        <input type="number" id="modal-cost" placeholder="直接打金額 (點進去無預設0)">

        <label>💳 先付錢的人 (代墊)</label>
        <select id="modal-payer">
          <option value="">尚未付款 / 免費</option>
          <option value="Dora">Dora 先付</option>
          <option value="Renee">Renee 先付</option>
        </select>
      </div>

      <div class="modal-footer">
        <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn btn-save" onclick="saveEvent()">確認儲存 (自動排序)</button>
      </div>
    </div>
  </div>

  <script>
    // 完整注入您影片中編輯好的所有行程與備忘！

    // 升級版本快取金鑰，確保朋友打開時優先採用最完整的預設資料
    const CACHE_KEY = "okinawa_trip_master_v5";
    let tripData;
    try {
      const stored = localStorage.getItem(CACHE_KEY);
      if (stored) {
        tripData = JSON.parse(stored);
      } else {
        tripData = JSON.parse(JSON.stringify(defaultData));
      }
    } catch (e) {
      tripData = JSON.parse(JSON.stringify(defaultData));
    }

    if (!tripData || !tripData.days || !tripData.shopping || !tripData.checklists) {
      tripData = JSON.parse(JSON.stringify(defaultData));
    }

    let activeShopPerson = "Dora";

    function saveData() {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(tripData));
      } catch (e) {}
      renderAll();
    }

    function resetToDefault() {
      if (confirm("確定要將所有內容恢復成初始排好的完整行程嗎？")) {
        localStorage.removeItem(CACHE_KEY);
        tripData = JSON.parse(JSON.stringify(defaultData));
        saveData();
      }
    }

    function parseTimeString(timeStr) {
      if (!timeStr) return 9999;
      const match = String(timeStr).match(/(\d{1,2})[:：](\d{2})/);
      if (match) {
        return parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
      }
      return 9998;
    }

    function sortDayEvents(dayIdx) {
      if (!tripData.days[dayIdx] || !tripData.days[dayIdx].events) return;
      tripData.days[dayIdx].events.sort(function(a, b) {
        return parseTimeString(a.time) - parseTimeString(b.time);
      });
    }

    function renderItinerary() {
      const container = document.getElementById("itinerary-section");
      if (!container) return;
      container.innerHTML = "";

      let overallTripCost = 0;
      let doraAdvance = 0;
      let reneeAdvance = 0;

      tripData.days.forEach(function(day, dIdx) {
        let dayTotal = 0;
        let dayDora = 0;
        let dayRenee = 0;

        sortDayEvents(dIdx);

        let eventsHtml = "";
        if (!day.events || day.events.length === 0) {
          eventsHtml = '<div style="text-align:center; padding:18px; font-size:13px; color:#95ACA0; border:1px dashed #D3E4DB; border-radius:10px;">🌿 這天目前留空，點擊下方「＋ 新增行程」開始規劃！</div>';
        } else {
          day.events.forEach(function(ev, eIdx) {
            const costNum = parseInt(ev.cost, 10) || 0;
            dayTotal += costNum;
            if (ev.payer === "Dora") dayDora += costNum;
            if (ev.payer === "Renee") dayRenee += costNum;

            let mapUrl = "";
            let routeLabel = "";
            if (ev.origin && ev.destination) {
              mapUrl = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(ev.origin) + "&destination=" + encodeURIComponent(ev.destination);
              routeLabel = '<div class="route-bar">📍 ' + ev.origin + ' ➜ ' + ev.destination + '</div>';
            } else {
              const query = ev.destination || ev.origin || ev.title || "沖繩";
              mapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
            }

            const valDisplay = (ev.cost !== undefined && ev.cost !== null && ev.cost !== "") ? ev.cost : "";

            eventsHtml += `
              <div class="event-card">
                <div class="event-top">
                  <span class="event-time">${ev.time || '時間待定'}</span>
                  <span class="event-tag ${ev.tag && ev.tag.indexOf('建議') !== -1 ? 'warn' : ''}">${ev.tag || '行程'}</span>
                </div>
                <div class="event-title">${ev.title || ''}</div>
                ${ev.desc ? `<div class="event-desc">${ev.desc}</div>` : ''}
                ${routeLabel}

                <div class="event-cost-bar">
                  <div class="payer-toggle">
                    <span>代墊：</span>
                    <button class="payer-btn ${ev.payer === 'Dora' ? 'active' : ''}" onclick="togglePayer(${dIdx}, ${eIdx}, 'Dora')">Dora</button>
                    <button class="payer-btn ${ev.payer === 'Renee' ? 'active' : ''}" onclick="togglePayer(${dIdx}, ${eIdx}, 'Renee')">Renee</button>
                  </div>
                  <div class="cost-input-box">
                    <span>¥</span>
                    <input type="number" value="${valDisplay}" placeholder="0" onchange="updateEventCost(${dIdx}, ${eIdx}, this.value)">
                  </div>
                </div>

                <div class="event-actions">
                  <a class="link-btn" href="${mapUrl}" target="_blank">🗺️ 地圖導航</a>
                  <button class="edit-btn" onclick="openEditModal(${dIdx}, ${eIdx})">✎ 編輯</button>
                  <button class="del-btn" onclick="deleteEvent(${dIdx}, ${eIdx})">✕</button>
                </div>
              </div>
            `;
          });
        }

        overallTripCost += dayTotal;
        doraAdvance += dayDora;
        reneeAdvance += dayRenee;

        container.innerHTML += `
          <div class="day-card">
            <div class="day-header">
              <div>
                <span class="day-badge">${day.d}</span>
                <div class="day-title">${day.date} ｜ ${day.desc}</div>
                <div class="day-sub">🚗 ${day.traffic}</div>
              </div>
            </div>
            <div class="timeline">${eventsHtml}</div>

            <div class="day-summary-bar">
              <span>Dora 墊: <strong>¥${dayDora.toLocaleString()}</strong></span>
              <span>Renee 墊: <strong>¥${dayRenee.toLocaleString()}</strong></span>
              <span>當日小計: <strong>¥${dayTotal.toLocaleString()}</strong></span>
            </div>

            <button class="add-event-btn" onclick="openAddModal(${dIdx})">＋ 新增行程 (自動排時間)</button>
          </div>
        `;
      });

      document.getElementById("total-trip-cost").innerText = "¥" + overallTripCost.toLocaleString();
      document.getElementById("total-dora-advance").innerText = "¥" + doraAdvance.toLocaleString();
      document.getElementById("total-renee-advance").innerText = "¥" + reneeAdvance.toLocaleString();
    }

    function renderShopping() {
      const container = document.getElementById("shop-items-container");
      if (!container) return;
      container.innerHTML = "";

      const doraList = tripData.shopping.Dora || [];
      const reneeList = tripData.shopping.Renee || [];

      document.getElementById("dora-count").innerText = doraList.length;
      document.getElementById("renee-count").innerText = reneeList.length;

      const currentList = tripData.shopping[activeShopPerson] || [];
      let personTotal = 0;

      currentList.forEach(function(i) {
        personTotal += (parseInt(i.cost, 10) || 0);
      });

      document.getElementById("current-person-label").innerText = activeShopPerson;
      document.getElementById("person-shop-total").innerText = "¥" + personTotal.toLocaleString();

      if (currentList.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:24px; color:#95ACA0; font-size:13px;">🛍️ ${activeShopPerson} 目前沒有購物項目，在上方隨時輸入新增！</div>`;
        return;
      }

      currentList.forEach(function(item, idx) {
        const valDisplay = (item.cost !== undefined && item.cost !== null && item.cost !== "") ? item.cost : "";
        container.innerHTML += `
          <div class="shop-item-card ${item.done ? 'done' : ''}">
            <div class="shop-left">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleShopDone(${idx})">
              <div>
                <span class="shop-title">${item.title}</span>
                ${item.tag ? `<span class="shop-tag">${item.tag}</span>` : ''}
              </div>
            </div>
            <div class="shop-cost-box">
              <span>¥</span>
              <input type="number" value="${valDisplay}" placeholder="0" onchange="updateShopCost(${idx}, this.value)">
              <button class="del-btn" style="margin-left:4px;" onclick="deleteShopItem(${idx})">✕</button>
            </div>
          </div>
        `;
      });
    }

    function renderChecklists() {
      const container = document.getElementById("checklist-containers");
      if (!container) return;
      container.innerHTML = "";

      const catSelect = document.getElementById("new-check-cat");
      const currentSelectedCat = catSelect.value;
      catSelect.innerHTML = "";

      tripData.checklists.forEach(function(group, gIdx) {
        const opt = document.createElement("option");
        opt.value = group.cat;
        opt.innerText = group.cat;
        catSelect.appendChild(opt);

        let itemsHtml = "";
        group.items.forEach(function(item, iIdx) {
          itemsHtml += `
            <div class="check-item ${item.done ? 'done' : ''}">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheckDone(${gIdx}, ${iIdx})">
              <div class="check-text">
                <strong>${item.title}</strong>
                ${item.desc ? `<span>${item.desc}</span>` : ''}
              </div>
              <button class="del-check-btn" onclick="deleteCheckItem(${gIdx}, ${iIdx})">✕</button>
            </div>
          `;
        });

        container.innerHTML += `
          <div class="checklist-group">
            <div class="checklist-header">
              <div class="checklist-title">${group.cat}</div>
              <button class="del-btn" onclick="deleteCheckCategory(${gIdx})">刪除分類</button>
            </div>
            ${itemsHtml || '<div style="font-size:12px; color:#A9B8B0;">尚無項目</div>'}
          </div>
        `;
      });

      const newOpt = document.createElement("option");
      newOpt.value = "__NEW__";
      newOpt.innerText = "＋ 自訂全新主題...";
      catSelect.appendChild(newOpt);

      if (currentSelectedCat) catSelect.value = currentSelectedCat;
    }

    function renderAll() {
      renderItinerary();
      renderShopping();
      renderChecklists();
    }

    function togglePayer(dIdx, eIdx, person) {
      const cur = tripData.days[dIdx].events[eIdx].payer;
      tripData.days[dIdx].events[eIdx].payer = (cur === person) ? "" : person;
      saveData();
    }

    function updateEventCost(dIdx, eIdx, val) {
      tripData.days[dIdx].events[eIdx].cost = (val === "") ? "" : Math.max(0, parseInt(val, 10) || 0);
      saveData();
    }

    function deleteEvent(dIdx, eIdx) {
      if (confirm("確定要刪除這筆行程嗎？")) {
        tripData.days[dIdx].events.splice(eIdx, 1);
        saveData();
      }
    }

    function openAddModal(dayIdx) {
      document.getElementById("modal-day-idx").value = dayIdx;
      document.getElementById("modal-edit-idx").value = "";
      document.getElementById("modal-title").innerText = "新增行程";
      document.getElementById("modal-time").value = "";
      document.getElementById("modal-event-title").value = "";
      document.getElementById("modal-origin").value = "";
      document.getElementById("modal-destination").value = "";
      document.getElementById("modal-tag").value = "";
      document.getElementById("modal-desc").value = "";
      document.getElementById("modal-cost").value = "";
      document.getElementById("modal-payer").value = "";
      document.getElementById("event-modal").style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function openEditModal(dayIdx, eventIdx) {
      const ev = tripData.days[dayIdx].events[eventIdx];
      document.getElementById("modal-day-idx").value = dayIdx;
      document.getElementById("modal-edit-idx").value = eventIdx;
      document.getElementById("modal-title").innerText = "修改行程內容";
      document.getElementById("modal-time").value = ev.time || "";
      document.getElementById("modal-event-title").value = ev.title || "";
      document.getElementById("modal-origin").value = ev.origin || "";
      document.getElementById("modal-destination").value = ev.destination || "";
      document.getElementById("modal-tag").value = ev.tag || "";
      document.getElementById("modal-desc").value = ev.desc || "";
      document.getElementById("modal-cost").value = (ev.cost !== undefined && ev.cost !== null) ? ev.cost : "";
      document.getElementById("modal-payer").value = ev.payer || "";
      document.getElementById("event-modal").style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      document.getElementById("event-modal").style.display = "none";
      document.body.style.overflow = "";
    }

    function saveEvent() {
      const dIdx = document.getElementById("modal-day-idx").value;
      const editIdx = document.getElementById("modal-edit-idx").value;
      const title = document.getElementById("modal-event-title").value.trim();
      if (!title) {
        alert("請輸入行程名稱！");
        return;
      }

      const costVal = document.getElementById("modal-cost").value;

      const eventPayload = {
        time: document.getElementById("modal-time").value.trim() || "待定",
        title: title,
        origin: document.getElementById("modal-origin").value.trim(),
        destination: document.getElementById("modal-destination").value.trim(),
        tag: document.getElementById("modal-tag").value.trim() || "景點",
        desc: document.getElementById("modal-desc").value.trim(),
        cost: (costVal === "") ? "" : (parseInt(costVal, 10) || 0),
        payer: document.getElementById("modal-payer").value
      };

      if (editIdx !== "") {
        tripData.days[dIdx].events[parseInt(editIdx, 10)] = eventPayload;
      } else {
        tripData.days[dIdx].events.push(eventPayload);
      }

      sortDayEvents(dIdx);
      closeModal();
      saveData();
    }

    function switchShopPerson(person) {
      activeShopPerson = person;
      document.getElementById("btn-person-dora").classList.toggle("active", person === "Dora");
      document.getElementById("btn-person-renee").classList.toggle("active", person === "Renee");
      renderShopping();
    }

    function addShopItem() {
      const titleInput = document.getElementById("new-shop-title");
      const tagInput = document.getElementById("new-shop-tag");
      const title = titleInput.value.trim();
      if (!title) return;

      if (!tripData.shopping[activeShopPerson]) {
        tripData.shopping[activeShopPerson] = [];
      }

      tripData.shopping[activeShopPerson].push({
        title: title,
        tag: tagInput.value.trim() || "購物",
        done: false,
        cost: ""
      });

      titleInput.value = "";
      tagInput.value = "";
      saveData();
    }

    function toggleShopDone(idx) {
      tripData.shopping[activeShopPerson][idx].done = !tripData.shopping[activeShopPerson][idx].done;
      saveData();
    }

    function updateShopCost(idx, val) {
      tripData.shopping[activeShopPerson][idx].cost = (val === "") ? "" : Math.max(0, parseInt(val, 10) || 0);
      saveData();
    }

    function deleteShopItem(idx) {
      tripData.shopping[activeShopPerson].splice(idx, 1);
      saveData();
    }

    function toggleCustomCatInput(val) {
      const customInput = document.getElementById("new-check-custom-cat");
      customInput.style.display = (val === "__NEW__") ? "block" : "none";
    }

    function addChecklistItem() {
      const catSelect = document.getElementById("new-check-cat");
      const customCatInput = document.getElementById("new-check-custom-cat");
      const titleInput = document.getElementById("new-check-title");
      const descInput = document.getElementById("new-check-desc");

      let category = catSelect.value;
      if (category === "__NEW__") {
        category = customCatInput.value.trim();
        if (!category) {
          alert("請輸入全新主題名稱！");
          return;
        }
      }

      const title = titleInput.value.trim();
      if (!title) {
        alert("請輸入備忘項目名稱！");
        return;
      }

      let group = null;
      for (let i = 0; i < tripData.checklists.length; i++) {
        if (tripData.checklists[i].cat === category) {
          group = tripData.checklists[i];
          break;
        }
      }

      if (!group) {
        group = { cat: category, items: [] };
        tripData.checklists.push(group);
      }

      group.items.push({
        title: title,
        desc: descInput.value.trim(),
        done: false
      });

      titleInput.value = "";
      descInput.value = "";
      customCatInput.value = "";
      customCatInput.style.display = "none";
      catSelect.value = category;
      saveData();
    }

    function toggleCheckDone(gIdx, iIdx) {
      tripData.checklists[gIdx].items[iIdx].done = !tripData.checklists[gIdx].items[iIdx].done;
      saveData();
    }

    function deleteCheckItem(gIdx, iIdx) {
      tripData.checklists[gIdx].items.splice(iIdx, 1);
      saveData();
    }

    function deleteCheckCategory(gIdx) {
      if (confirm("確定要刪除此主題分類嗎？")) {
        tripData.checklists.splice(gIdx, 1);
        saveData();
      }
    }

    function switchMainTab(tab) {
      document.getElementById("tab-btn-itinerary").classList.toggle("active", tab === 'itinerary');
      document.getElementById("tab-btn-shopping").classList.toggle("active", tab === 'shopping');
      document.getElementById("tab-btn-checklist").classList.toggle("active", tab === 'checklist');

      document.getElementById("itinerary-section").style.display = (tab === 'itinerary') ? 'block' : 'none';
      document.getElementById("shopping-section").style.display = (tab === 'shopping') ? 'block' : 'none';
      document.getElementById("checklist-section").style.display = (tab === 'checklist') ? 'block' : 'none';
    }

    renderAll();
  </script>
</body>
</html>
